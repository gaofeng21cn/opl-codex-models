name: Windows Preview Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Codex Models release tag
        required: true
        default: v0.4.2
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Test Windows implementation
        env:
          PYTHONPATH: src
        run: python -m pytest tests -q -rs
      - name: Build portable preview
        env:
          CODEX_MODELS_RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/build_windows.py
      - name: Validate package contents and checksum
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $zip = "dist/Codex-Models-Windows-$env:RELEASE_TAG-preview.zip"
          if (-not (Test-Path $zip)) { throw "Missing $zip" }
          $entries = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip)).Entries.FullName
          foreach ($name in @('CodexModelManager.exe', 'CodexModelManagerWorker.exe', 'VERSION.txt', 'QUICKSTART.md')) {
            if ($entries -notcontains "CodexModelManager/$name") { throw "Missing $name in $zip" }
          }
          $digest = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $(Split-Path $zip -Leaf)" | Set-Content -Encoding ascii "$zip.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-models-windows-${{ inputs.release_tag }}-preview
          path: |
            windows/dist/Codex-Models-Windows-${{ inputs.release_tag }}-preview.zip
            windows/dist/Codex-Models-Windows-${{ inputs.release_tag }}-preview.zip.sha256
          if-no-files-found: error
